<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <!-- Left Side: Air 1 Travels & Tours Logo -->
  <g transform="translate(10, 5)">
    <!-- Red Airplane Silhouette -->
    <g transform="translate(0, 8)">
      <!-- Main body and wing path -->
      <path d="M 55,20 C 50,23 42,28 32,32 C 26,34 12,30 8,28 L 6,26 L 8,24 L 20,22 L 32,4 L 40,4 L 35,18 L 60,15 L 63,4 L 67,4 L 66,14 L 78,12 C 84,11 88,12 89,14 C 91,16 88,18 84,19 C 78,21 68,23 60,24 L 56,42 L 50,42 Z" fill="#ef4444" transform="rotate(-8, 45, 20) scale(0.9)" />
    </g>
    <!-- Air 1 text -->
    <text x="82" y="44" font-family="'Arial Black', sans-serif" font-weight="900" font-size="36" fill="#003566">Air</text>
    <text x="138" y="44" font-family="'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#ef4444">1</text>
    <!-- Travels & Tours text -->
    <text x="5" y="68" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#003566" letter-spacing="1">Travels &amp; Tours</text>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="195" y1="20" x2="195" y2="75" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Right Side: IATA Accredited Agent -->
  <g transform="translate(205, 23)">
    <!-- IATA Globe Logo -->
    <g transform="translate(0, 2)">
      <!-- Globe Circle -->
      <circle cx="20" cy="20" r="19" fill="none" stroke="#0073af" stroke-width="2" />
      <circle cx="20" cy="20" r="15" fill="none" stroke="#0073af" stroke-width="1" />
      <!-- Latitude/Longitude Grid Lines -->
      <path d="M 20,1 A 19,19 0 0,0 20,39 M 20,1 A 19,19 0 0,1 20,39" fill="none" stroke="#0073af" stroke-width="1" />
      <path d="M 20,5 A 15,15 0 0,0 20,35 M 20,5 A 15,15 0 0,1 20,35" fill="none" stroke="#0073af" stroke-width="1" />
      <line x1="1" y1="20" x2="39" y2="20" stroke="#0073af" stroke-width="1" />
      <path d="M 6,10 Q 20,18 34,10 M 6,30 Q 20,22 34,30" fill="none" stroke="#0073af" stroke-width="1" />
      <!-- IATA Text Background -->
      <rect x="5" y="12" width="30" height="15" fill="#ffffff" />
      <!-- IATA Text -->
      <text x="20" y="24" font-family="'Arial Black', sans-serif" font-weight="900" font-size="11" fill="#0073af" text-anchor="middle" letter-spacing="0.2">IATA</text>
    </g>
    
    <!-- Accredited Agent Text -->
    <line x1="48" y1="5" x2="48" y2="38" stroke="#cbd5e1" stroke-width="1" />
    <text x="56" y="18" font-family="Arial, sans-serif" font-weight="normal" font-size="11" fill="#003566">Accredited</text>
    <text x="56" y="32" font-family="Arial, sans-serif" font-weight="normal" font-size="11" fill="#003566">Agent</text>
  </g>
</svg>
